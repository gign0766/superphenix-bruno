info:
  name: Retrieve all products
  type: http
  seq: 2
  tags:
    - Project Manager

http:
  method: GET
  url: "{{baseUrl}}/v1/project-manager/products"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Products
    request:
      url: "{{baseUrl}}/v1/project-manager/products"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "codeAZ": "",
              "createdAt": "",
              "deletedAt": {
                "time": "",
                "valid": false
              },
              "effectiveID": "",
              "id": "",
              "productName": "",
              "productType": {
                "createdAt": "",
                "deletedAt": {
                  "time": "",
                  "valid": false
                },
                "id": "",
                "name": "",
                "updatedAt": ""
              },
              "productTypeId": "",
              "project": {
                "createdAt": "",
                "deletedAt": {
                  "time": "",
                  "valid": false
                },
                "id": "",
                "name": "",
                "orgaId": "",
                "updatedAt": ""
              },
              "projectId": "",
              "updatedAt": ""
            }
          ]
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/v1/project-manager/products"
      method: GET
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Internal Server Error
    request:
      url: "{{baseUrl}}/v1/project-manager/products"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""

docs: Retrieve all products with their associations. Requires super-admin privileges.
