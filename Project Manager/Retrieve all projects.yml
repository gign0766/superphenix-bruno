info:
  name: Retrieve all projects
  type: http
  seq: 3
  tags:
    - Project Manager

http:
  method: GET
  url: "{{baseUrl}}/v1/project-manager/projects"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Projects
    request:
      url: "{{baseUrl}}/v1/project-manager/projects"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "createdAt": "",
              "deletedAt": {
                "time": "",
                "valid": false
              },
              "id": "",
              "name": "",
              "orgaId": "",
              "updatedAt": ""
            }
          ]
  - name: 404 Response
    description: Not Found
    request:
      url: "{{baseUrl}}/v1/project-manager/projects"
      method: GET
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Internal Server Error
    request:
      url: "{{baseUrl}}/v1/project-manager/projects"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""

docs: Retrieve all projects with their associations. Requires super-admin privileges.
