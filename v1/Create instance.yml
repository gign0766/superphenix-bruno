            "ipv6": "",
            "macAddress": "",
            "model": "",
            "order": 0,
            "subnetEId": ""
          }
        ],
        "sshKeys": []
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

