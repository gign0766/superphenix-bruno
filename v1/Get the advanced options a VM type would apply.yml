info:
  name: Get the advanced options a VM type would apply
  type: http
  seq: 106
  tags:
    - v1
    - Superphenix Controller

http:
  method: GET
  url: "{{baseUrl}}/:orgaId/api/spx-ctrl/:az/:projectId/vm-type/:name/advanced-options"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
    - name: az
      value: ""
      type: path
      description: AZ Code
    - name: projectId
      value: ""
      type: path
      description: Project ID
    - name: name
      value: ""
      type: path
      description: VM Cluster Preference Name
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

