    - project

http:
  method: POST
  url: "{{baseUrl}}/v1/organization/:orgaId/project"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
  body:
