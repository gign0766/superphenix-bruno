info:
  name: Transfer organization ownership
  type: http
  seq: 20
  tags:
    - v1
    - organization

http:
  method: POST
  url: "{{baseUrl}}/v1/organization/:orgaId/transfer"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
  body:
    type: json
    data: |-
      {
        "newOwnerInviteCode": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

