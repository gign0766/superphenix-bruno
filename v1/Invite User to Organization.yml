info:
  name: Invite User to Organization
  type: http
  seq: 14
  tags:
    - v1
    - iam

http:
  method: POST
  url: "{{baseUrl}}/v1/organization/:orgaId/iam/invite"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
  body:
    type: json
    data: |-
      {
        "groupIds": [],
        "userInviteCode": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

