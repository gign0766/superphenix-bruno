info:
  name: Generate Access and Refresh Tokens
  type: http
  seq: 22
  tags:
    - v1
    - session

http:
  method: GET
  url: "{{baseUrl}}/v1/session/token"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 302 Response
    description: Found
    request:
      url: "{{baseUrl}}/v1/session/token"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
          description: Access token used to check user access in Superphenix API.
    response:
      status: 302
      statusText: Found
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Internal Server Error
    request:
      url: "{{baseUrl}}/v1/session/token"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
          description: Access token used to check user access in Superphenix API.
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""

docs: Generates an access token and an associated refresh token
