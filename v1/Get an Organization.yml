info:
  name: Get an Organization
  type: http
  seq: 4
  tags:
    - v1
    - organization

http:
  method: GET
  url: "{{baseUrl}}/v1/organization/:orgaId"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

