info:
  name: Duplicate an IAM group into a custom one
  type: http
  seq: 13
  tags:
    - v1
    - iam

http:
  method: POST
  url: "{{baseUrl}}/v1/organization/:orgaId/iam/group/:groupId/duplicate"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
    - name: groupId
      value: ""
      type: path
      description: Group ID
  body:
    type: json
    data: |-
      {
        "name": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

