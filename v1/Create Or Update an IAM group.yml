info:
  name: Create Or Update an IAM group
  type: http
  seq: 10
  tags:
    - v1
    - iam

http:
  method: POST
  url: "{{baseUrl}}/v1/organization/:orgaId/iam/group"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
  body:
    type: json
    data: |-
      {
        "allProjects": false,
        "id": "",
        "name": "",
        "permissionSets": [],
        "projectIds": []
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

