  seq: 35
  tags:
    - v1
    - Superphenix Controller

http:
  method: GET
  url: "{{baseUrl}}/:orgaId/api/spx-ctrl/:az/:projectId/bucket/:effectiveId/credentials"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
    - name: az
      value: ""
      type: path
      description: AZ Code
    - name: projectId
      value: ""
      type: path
      description: Project ID
    - name: effectiveId
      value: ""
      type: path
      description: Bucket EID
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
