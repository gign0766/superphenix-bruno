      type: path
      description: Bucket EID
  body:
    type: json
    data: |-
      {
        "general": {
          "config": {
            "lifecycle": "",
            "maxObjects": 0,
            "maxSize": "",
            "policy": ""
          },
          "productName": ""
        }
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
