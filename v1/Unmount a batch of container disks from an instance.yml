  type: http
  seq: 61
  tags:
    - v1
    - Superphenix Controller

http:
  method: POST
  url: "{{baseUrl}}/:orgaId/api/spx-ctrl/:az/:projectId/instance/:effectiveId/container-disk/unmount"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
    - name: az
      value: ""
      type: path
      description: AZ Code
    - name: projectId
      value: ""
      type: path
      description: Project ID
    - name: effectiveId
      value: ""
      type: path
      description: Instance EID
  body:
    type: json
    data: |-
      {
        "ids": []
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

