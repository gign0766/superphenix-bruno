info:
  name: Retrieve all EIPs
  type: http
  seq: 115
  tags:
    - v1
    - Superphenix Controller

http:
  method: GET
  url: "{{baseUrl}}/:orgaId/api/spx-ctrl/:projectId/eip"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
    - name: projectId
      value: ""
      type: path
      description: Project ID
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

