info:
  name: List container-disk catalog
  type: http
  seq: 36
  tags:
    - v1
    - Superphenix Controller

http:
  method: GET
  url: "{{baseUrl}}/:orgaId/api/spx-ctrl/:az/:projectId/container-disks"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  params:
    - name: orgaId
      value: ""
      type: path
      description: Organization ID
    - name: az
      value: ""
      type: path
      description: AZ Code
    - name: projectId
      value: ""
      type: path
      description: Project ID
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

