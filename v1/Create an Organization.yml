info:
  name: Create an Organization
  type: http
  seq: 3
  tags:
    - v1
    - organization

http:
  method: POST
  url: "{{baseUrl}}/v1/organization"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
      description: Access token used to check user access in Superphenix API.
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
